# Cheap checks on pushes to main and on pull requests: formatting, go.mod
# tidiness and doc links. Nothing is built or tested here; the test suites
# run locally before a release (CONTRIBUTING.md), and releases start by hand
# (release.yml).
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels the run it replaces; other runs are
# never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: gofmt / go.mod / doc links / frontend format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.9
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 -r gofmt -l)
          if [ -n "$unformatted" ]; then
            printf 'These files need gofmt:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      - name: go.mod and go.sum are tidy
        if: ${{ !cancelled() }}
        run: go mod tidy -diff

      - name: Links in the Markdown docs
        if: ${{ !cancelled() }}
        run: sh scripts/check-doc-links.sh

      # Prettier alone, without installing the frontend's dependencies.
      - name: Frontend formatting
        if: ${{ !cancelled() }}
        working-directory: web/frontend
        run: npx --yes "prettier@$(node -p "require('./package.json').devDependencies.prettier.replace(/^[^0-9]*/, '')")" --check .
